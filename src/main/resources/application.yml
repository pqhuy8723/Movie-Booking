spring:
  application:
    name: movie36
  datasource:
    url: jdbc:mysql://localhost:3306/movie_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: sa123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:defaultSecretForDevOnly12345678901234567890}
  expiration-time: ${JWT_EXPIRATION_TIME:86400000}
  refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:604800000}

server:
  port: 8080